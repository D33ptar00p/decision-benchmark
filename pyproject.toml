[project]
name = "decision-benchmark"
version = "0.1.0"
description = "Local benchmark of decision models (Strands Decider, Laya, Nimble, TEV) with a small web UI and a JevBench harness runner"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "ollama>=0.6.2",
    "httpx>=0.27",
    "datasets>=3.0",
    "strands-decider>=0.1.0",
    "laya>=0.3.24",
    "flash-linear-attention>=0.5.2",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
